spring.application.name=firstProject
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-5-nano

# Enabling logging level for default advisor
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.level.org.springframework.ai.rag=DEBUG
logging.level.org.springframework.ai.vectorstore=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG

#spring.datasource.url=jdbc:mysql://localhost:3306/ai_service

#Maria DB
spring.datasource.url=jdbc:mariadb://localhost:3306/ai-database
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# vector store config
spring.ai.vectorstore.mariadb.initialize-schema=true
spring.ai.vectorstore.mariadb.distance-type=COSINE
spring.ai.vectorstore.mariadb.dimensions=1536

